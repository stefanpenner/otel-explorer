\* Mutation 5 (MUST FAIL) — restores Finding 5's pre-fix bug.
\* BugSanity = TRUE: the pre-#9 24h recalc recomputed the SAME poisoned value
\* (max over ALL jobs' CompletedAt, no threshold filter), so a completed
\* run's >24h span is never healed when the poison is a job's own CompletedAt.
\* SanityHeals24h is GREEN under the fix (MC.cfg) and MUST FAIL here.
CONSTANTS
    Tmax = 4
    Threshold = 2
    Bug = FALSE
    BugClamp = FALSE
    BugBounds = FALSE
    BugSanity = TRUE
INIT Init
NEXT Next
INVARIANT TypeInvariant
INVARIANT SanityHeals24h
