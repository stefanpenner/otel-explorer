\* Mutation config: Bug = TRUE disables the job-level parent clamp entirely
\* (the clampSpanToParent protection, analyzer.go:884).
\* JobClampedToRun is green under all-flags-FALSE (see MC.cfg) and MUST FAIL
\* here — proves the spec actually depends on that protection.
CONSTANTS
    Tmax = 4
    Threshold = 2
    Bug = TRUE
    BugClamp = FALSE
    BugBounds = FALSE
    BugSanity = FALSE
INIT Init
NEXT Next
INVARIANT TypeInvariant
INVARIANT JobClampedToRun
