\* Main config: FIXED code (all Bug* flags FALSE), tiny bounds.
\* Tmax=4 gives times 0..4 (0 = missing); Threshold=2 models the 24h bound.
\* All five finding invariants are GREEN here; the pre-fix violations live
\* in MCMutation*.cfg. Green TLC at these bounds = strong bug hunt, not proof.
CONSTANTS
    Tmax = 4
    Threshold = 2
    Bug = FALSE
    BugClamp = FALSE
    BugBounds = FALSE
    BugSanity = FALSE
INIT Init
NEXT Next
INVARIANT TypeInvariant
INVARIANT ExportedSpansOrdered
INVARIANT JobClampedToRun
INVARIANT SanityNeverBelowValidCompletedJobEnd
INVARIANT JobSkipIsDeadCode
INVARIANT StepSkipIsDeadCode
INVARIANT ExportedChildEndInParent
INVARIANT ExportedChildStartInParent
INVARIANT MsChildWithinParent
INVARIANT RunBoundsOrdered
INVARIANT SanityHeals24h
