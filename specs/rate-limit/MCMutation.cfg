\* MUTATION config: identical to MCSolo.cfg but Bug=TRUE, which removes the
\* waitIfNeeded check (goroutines send even when the limiter says exhausted).
\* Expected: FAIL on NoOvershoot -- proves the invariant set has teeth and
\* that waitIfNeeded is the load-bearing client-side protection.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Gs = {g1}
    MaxConcurrency = 1
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 2
    Bug = TRUE
    Bug2 = FALSE
    Bug3 = FALSE
    NegHeader = FALSE
INVARIANT TypeInvariant
INVARIANT RemainingNonNegative
INVARIANT SemaphoreBounded
INVARIANT BackoffCapped
INVARIANT NoOvershoot
