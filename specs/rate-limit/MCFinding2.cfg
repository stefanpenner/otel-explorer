\* FINDING config (STILL REAL after the 2026-07-06 recheck fix, narrower
\* than before): PROPOSED invariant NoSleeperOvershoot -- a goroutine coming
\* straight from a sleep-wake never hits an exhausted server.  Expected:
\* FAIL.  The recheck closes the informed wake-together race (see
\* MCRecheck/MCMutation2), but a woken sleeper whose recheck reads a STALE
\* limiter (the competing consumer's headers not yet delivered) still fires
\* into the exhausted fresh window -- the NoOvershoot stampede in sleeper
\* clothing.  Unfixable client-side; kept as a documented finding.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Gs = {g1, g2, g3}
    MaxConcurrency = 2
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 1
    Bug = FALSE
    Bug2 = FALSE
    Bug3 = FALSE
    NegHeader = FALSE
SYMMETRY Perms
INVARIANT TypeInvariant
INVARIANT NoSleeperOvershoot
