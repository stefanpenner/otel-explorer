\* Main config: code-documented invariants, all mutation knobs off, and the
\* NegHeader fault ON — the fixed clamp (2026-07-06) keeps
\* RemainingNonNegative green even against hostile headers.  Expected: PASS.
\* The PROPOSED overshoot invariants are deliberately NOT here -- they are
\* real findings; see MCFinding1.cfg / MCFinding2.cfg.  The recheck property
\* (WakeRechecksLimiter) lives in MCRecheck.cfg (no symmetry: TLC forbids
\* symmetry with temporal/action properties).
