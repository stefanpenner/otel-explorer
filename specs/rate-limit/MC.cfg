    Gs = {g1, g2, g3}
    MaxConcurrency = 2
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 1
    Bug = FALSE
    Bug2 = FALSE
    Bug3 = FALSE
    NegHeader = TRUE
SYMMETRY Perms
INVARIANT TypeInvariant
INVARIANT RemainingNonNegative
INVARIANT SemaphoreBounded
INVARIANT BackoffCapped
