\* MUTATION for fixed FINDING 14: Bug3=TRUE drops the negative-header clamp
\* (pre-fix updateFromHeaders stored strconv.Atoi("-1") verbatim), and the
\* NegHeader fault emits a hostile x-ratelimit-remaining of -1.  MUST FAIL
\* RemainingNonNegative -- a stored -1 also disables waiting entirely
\* (waitDuration tests remaining == 0 exactly).  Solo bounds suffice: the
\* first delivered response poisons the limiter.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Gs = {g1}
    MaxConcurrency = 1
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 2
    Bug = FALSE
    Bug2 = FALSE
    Bug3 = TRUE
    NegHeader = TRUE
INVARIANT TypeInvariant
INVARIANT RemainingNonNegative
