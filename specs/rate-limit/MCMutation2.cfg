\* MUTATION for fixed FINDING 13: Bug2=TRUE drops the recheck after waking
\* (pre-fix behavior: sleepContext returns and the request fires blind).
\* Identical world to MCRecheck.cfg.  MUST FAIL WakeRechecksLimiter --
\* witness: g1 exhausts the window; g2 sleeps on its reset; the window
\* resets and g3 consumes it, its headers ARE delivered (limiter now says
\* exhausted until the new reset); g2 wakes and fires anyway.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Gs = {g1, g2, g3}
    MaxConcurrency = 2
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 1
    Bug = FALSE
    Bug2 = TRUE
    Bug3 = FALSE
    NegHeader = FALSE
INVARIANT TypeInvariant
PROPERTY WakeRechecksLimiter
