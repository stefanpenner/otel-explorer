    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 1
    Bug = FALSE
    Bug2 = FALSE
    Bug3 = FALSE
    NegHeader = FALSE
INVARIANT TypeInvariant
PROPERTY WakeRechecksLimiter
