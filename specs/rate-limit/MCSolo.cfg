\* CONTROL for the mutation check: single goroutine, all knobs off, WITH the
\* proposed NoOvershoot invariant.  Expected: PASS -- with only one client
\* the waitIfNeeded protection is sufficient; overshoot needs concurrency.
\* This makes MCMutation.cfg meaningful (same world, Bug=TRUE, must fail).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Gs = {g1}
    MaxConcurrency = 1
    MaxClock = 5
    Quota = 1
    ResetDelay = 2
    BackoffCap = 2
    MaxAttempts = 1
    MaxReqs = 2
    Bug = FALSE
    Bug2 = FALSE
    Bug3 = FALSE
    NegHeader = FALSE
INVARIANT TypeInvariant
INVARIANT RemainingNonNegative
INVARIANT SemaphoreBounded
INVARIANT BackoffCapped
INVARIANT NoOvershoot
