\* Mutation for the nested-##[group] data loss (fixed 2026-07-06):
\* BugNest=TRUE restores the pre-fix overwrite that silently dropped the
\* outer group and its collected lines (old timestamp.go:50-56).
\* MUST FAIL Inv_NoNestedDrop.
SPECIFICATION Spec
CONSTANTS
    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = TRUE
    Bug       = FALSE
    BugSort   = FALSE
    BugClamp  = FALSE
    BugChild  = FALSE
    BugNest   = TRUE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_NoNestedDrop
