\* Mutation for former FINDING 4 (fixed 2026-07-06): BugSort + BugClamp
\* restore the pre-fix override path: two groups appended out of start
\* order make a NON-LAST group span end before it starts — no
\* caller-supplied stepEnd involved.  MUST FAIL Inv_InteriorSpanStartLeEnd.
SPECIFICATION Spec
