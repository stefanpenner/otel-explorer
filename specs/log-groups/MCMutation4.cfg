    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = FALSE
    Bug       = FALSE
    BugSort   = TRUE
    BugClamp  = TRUE
    BugChild  = FALSE
    BugNest   = FALSE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_InteriorSpanStartLeEnd
