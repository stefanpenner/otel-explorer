\* Mutation for former FINDING 2 (fixed 2026-07-06): BugSort=TRUE skips
\* the sort at parseWithGroups entry (timestamp.go:114-116), so groups
\* stay in close order and the sorted-by-start assumption behind the end
\* override is false.  MUST FAIL Inv_GroupsSortedByStart.
SPECIFICATION Spec
CONSTANTS
    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = FALSE
    Bug       = FALSE
    BugSort   = TRUE
    BugClamp  = FALSE
    BugChild  = FALSE
    BugNest   = FALSE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_GroupsSortedByStart
