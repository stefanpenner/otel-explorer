\* Mutation for former FINDING 3 (fixed 2026-07-06): BugChild=TRUE skips
\* the child clamp (timestamp.go:157, clampSpans 205-222), so a gap-parsed
\* child span sticks out past its parent group span.
\* MUST FAIL Inv_ChildInParent.
SPECIFICATION Spec
CONSTANTS
    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = FALSE
    Bug       = FALSE
    BugSort   = FALSE
    BugClamp  = FALSE
    BugChild  = TRUE
    BugNest   = FALSE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_ChildInParent
