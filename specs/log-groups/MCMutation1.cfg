\* Mutation for former FINDING 1 (fixed 2026-07-06): BugClamp=TRUE skips
\* the end-override clamp (timestamp.go:134-139), so the last group span's
\* end trusts a stepEnd that precedes the group start -> span with
\* start > end.  MUST FAIL Inv_SpanStartLeEnd.
SPECIFICATION Spec
CONSTANTS
    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = FALSE
    Bug       = FALSE
    BugSort   = FALSE
    BugClamp  = TRUE
    BugChild  = FALSE
    BugNest   = FALSE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_SpanStartLeEnd
