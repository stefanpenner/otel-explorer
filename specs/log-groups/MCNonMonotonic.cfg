\* The fault model the 2026-07-05 findings ran under: NON-monotonic
\* timestamps and an arbitrary step window, against the FIXED code
\* (sort + end clamp + child clamp + implicit-close + forward-only gap
\* baseline).  All former MCFinding1-4 invariants must now be GREEN.
SPECIFICATION Spec
CONSTANTS
    MaxTime  = 4
    MaxLines = 5
    MinGap   = 2
    MinSpan  = 1
    Monotonic = FALSE
    Bug       = FALSE
    BugSort   = FALSE
    BugClamp  = FALSE
    BugChild  = FALSE
    BugNest   = FALSE
    BugGap    = FALSE
INVARIANT TypeInvariant
INVARIANT Inv_GroupEndsSet
INVARIANT Inv_GroupsSortedByStart
INVARIANT Inv_SpanStartLeEnd
INVARIANT Inv_InteriorSpanStartLeEnd
INVARIANT Inv_ChildInParent
INVARIANT Inv_GroupSpansTile
INVARIANT Inv_NoNestedDrop
