\* Bait: claims a sync never finds a run needing job detail. Reaching a
\* nonempty pend needs the whole pipeline, so TLC MUST report a violation
\* with a witness trace. Proves the model explores the sync pipeline.
CONSTANTS
    Runs = {r1, r2}
    Syncers = {s1, s2}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = TRUE
    FreshNowAtListing = FALSE
    Bug = FALSE
    Bug2 = FALSE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT BaitNoRunEverNeedsJobs
