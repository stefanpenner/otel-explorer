\* Baseline for the mutation check: ONE syncer, NO seeder (no concurrent
\* writer), all mutation knobs off. The attempt-invalidation invariant holds
\* here — compare MCMutation.cfg (identical bounds, Bug=TRUE, must fail) and
\* MCMutation1.cfg (seeder on + Bug2=TRUE: the pre-fix UpsertJobs stomp).
CONSTANTS
    Runs = {r1, r2}
    Syncers = {s1}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = FALSE
    FreshNowAtListing = FALSE
    Bug = FALSE
    Bug2 = FALSE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT NoStaleFetchedJobs
PROPERTY SyncedMonotone
PROPERTY AttemptBumpNoStaleCarry
