\* Mutation check: identical to MCSingle.cfg except Bug=TRUE, which
\* disables the attempt-bump jobs_fetched reset (store.go:164-166 CASE).
\* MUST FAIL — proves the invariants have teeth.
CONSTANTS
    Runs = {r1, r2}
    Syncers = {s1}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = FALSE
    FreshNowAtListing = FALSE
    Bug = TRUE
    Bug2 = FALSE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT NoStaleFetchedJobs
PROPERTY AttemptBumpNoStaleCarry
