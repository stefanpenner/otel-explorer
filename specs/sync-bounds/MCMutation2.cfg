\* MUTATION for fixed FINDING 2 (was MCFinding2.cfg): FreshNowAtListing=TRUE
\* restores the pre-fix listing slide — `since` recomputed from a fresh
\* time.Now() at listing time instead of the now captured at sync start
\* (fixed 2026-07-06: sync.go:74-77 passes the captured now down to
\* FetchWorkflowRunsSince). A multi-day clock jump mid-sync then slides the
\* window, the watermark jumps over an unsynced run, and every later clamped
\* window misses it. MUST FAIL NoPermanentGap — proves the invariant keeps
\* its teeth. Needs 3 runs: an anchor synced at day 1 (makes oldest=1 so
\* windows clamp), the victim appearing at day 1 after the anchor's listing,
\* and a day-3 run that drags the watermark over the victim.
CONSTANTS
    Runs = {r1, r2, r3}
    Syncers = {s1}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = FALSE
    FreshNowAtListing = TRUE
    Bug = FALSE
    Bug2 = FALSE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT NoPermanentGap
