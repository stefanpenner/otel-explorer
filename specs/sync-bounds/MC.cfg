\* Main config: 2 runs, 2 concurrent syncers, full fault model, faithful to
\* the FIXED code (2026-07-06): UpsertJobs attempt guard on (Bug2=FALSE),
\* listing `since` computed once (FreshNowAtListing=FALSE). The formerly
\* violated finding invariants live here now and must PASS; the pre-fix
\* behaviors are kept failing in MCMutation1.cfg / MCMutation2.cfg.
CONSTANTS
    Runs = {r1, r2}
    Syncers = {s1, s2}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = TRUE
    FreshNowAtListing = FALSE
    Bug = FALSE
    Bug2 = FALSE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT NoStaleFetchedJobs
INVARIANT NoPermanentGap
PROPERTY SyncedMonotone
PROPERTY AttemptBumpNoStaleCarry
