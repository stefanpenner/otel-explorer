\* MUTATION for fixed FINDING 1 (was MCFinding1.cfg): Bug2=TRUE removes the
\* UpsertJobs attempt guard (store.go:390-400, added 2026-07-06), restoring
\* the pre-fix stomp: a URL-analysis SeedRuns advances run_attempt between
\* this sync's RunsNeedingJobs read and its UpsertJobs write; the stale
\* worker then deletes the good jobs and sets jobs_fetched=1 with attempts
\* equal, so the CASE reset never fires again. MUST FAIL NoStaleFetchedJobs
\* — proves the invariant keeps its teeth against the old behavior.
CONSTANTS
    Runs = {r1, r2}
    Syncers = {s1}
    MaxTime = 3
    MaxAttempt = 2
    Days = 3
    Overlap = 1
    Seeding = TRUE
    FreshNowAtListing = FALSE
    Bug = FALSE
    Bug2 = TRUE
SPECIFICATION Spec
INVARIANT TypeInvariant
INVARIANT NoStaleFetchedJobs
