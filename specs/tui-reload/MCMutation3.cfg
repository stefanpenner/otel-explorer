\* MCMutation3.cfg — Bug2=TRUE strips the (job, gen) tag check from
\* LogFetchResultMsg handling: the pre-2026-07-06 code (campaign finding
\* #3, formerly MCFinding1.cfg).  A stale LogFetchResultMsg from a fetch
\* started before a reload is attributed to a NEW fetch started after
\* the reload.  Expected: FAIL NoStaleLogSpans /
\* FetchedJobsHaveTheirSpans — proves the invariants keep their teeth.
\* Fixed in code: logfetch.go:63-66 tags, model.go:365-372 discards.
CONSTANTS
  Jobs = {j1, j2}
  MaxGen = 2
  Bug = FALSE
  Bug2 = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeInvariant
INVARIANT AtMostOneReloadRunning
INVARIANT NoStaleLogSpans
INVARIANT FetchedJobsHaveTheirSpans
INVARIANT DisplayedIsLatestSuccess
INVARIANT NoStuckListen
