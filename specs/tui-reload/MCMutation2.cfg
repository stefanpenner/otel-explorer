\* MCMutation2.cfg — same mutation (Bug=TRUE, guard removed) but WITHOUT
\* the direct AtMostOneReloadRunning invariant, to surface the DEEPER
\* consequences of concurrent reloads (discovery race (b)): stale
\* ReloadResultMsg applied after a newer one (DisplayedIsLatestSuccess)
\* and orphaned listen commands blocked forever (NoStuckListen).
\* Expected: FAIL.
CONSTANTS
  Jobs = {j1, j2}
  MaxGen = 2
  Bug = TRUE
  Bug2 = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeInvariant
INVARIANT NoStaleLogSpans
INVARIANT FetchedJobsHaveTheirSpans
INVARIANT DisplayedIsLatestSuccess
INVARIANT NoStuckListen
