\* Second green config: 1 attempt x 2 interchangeable jobs (symmetry).
\* Covers job-pair interactions inside a single attempt's metrics.
\* Same invariant set as MC.cfg (findings 1-4 fixed 2026-07-06).
CONSTANTS
  Bug = FALSE
  BugPendingRunFailed = FALSE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = FALSE
  BugNoConclFallback = FALSE
  MaxAttempt = 1
  j1 = j1
  j2 = j2
  JobIds = {j1, j2}
SYMMETRY Symm
INIT Init
NEXT Next
INVARIANTS
  TypeInvariant
  InvPendingNeverFailed
  InvEmittedHaveConcl
  InvPendingRunNotFailed
  InvLinkTargetsEmitted
  InvQueueOnlyCompletedJobs
  InvTimedOutAttemptNotSuccess
  InvPendingJobsVisible
  InvCompletedRunSpanHasConclusion
