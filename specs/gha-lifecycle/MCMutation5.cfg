\* MUTATION for the fixed discovery note: BugUnstartedInvisible = TRUE
\* restores the old processJob order (early return on StartedAt == ""
\* BEFORE pending classification). InvPendingJobsVisible MUST FAIL: a
\* queued-but-never-started job is invisible to PendingJobs.
CONSTANTS
  Bug = FALSE
  BugPendingRunFailed = FALSE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = TRUE
  BugNoConclFallback = FALSE
  MaxAttempt = 1
  j1 = j1
  JobIds = {j1}
INIT Init
NEXT Next
INVARIANTS
  InvPendingJobsVisible
