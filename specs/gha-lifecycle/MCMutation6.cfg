\* MUTATION for the empty-conclusion fallback (part of the Finding 4 fix's
\* shared conclusionFromJobs helper): BugNoConclFallback = TRUE emits a
\* completed run's empty conclusion verbatim (old analyzer.go:638).
\* InvCompletedRunSpanHasConclusion MUST FAIL: GhRunComplete with the
\* empty-conclusion fault yields a conclusion-less workflow span.
CONSTANTS
  Bug = FALSE
  BugPendingRunFailed = FALSE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = FALSE
  BugNoConclFallback = TRUE
  MaxAttempt = 1
  j1 = j1
  JobIds = {j1}
INIT Init
NEXT Next
INVARIANTS
  InvCompletedRunSpanHasConclusion
