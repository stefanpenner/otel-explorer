\* MUTATION config: Bug = TRUE drops the !isPending guard on failed-job
\* counting (models deleting `!isPending &&` at analyzer.go:877).
\* InvPendingNeverFailed MUST FAIL: a job completed with conclusion=failure
\* but missing CompletedAt is pending AND counted failed.
CONSTANTS
  Bug = TRUE
  BugPendingRunFailed = FALSE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = FALSE
  BugNoConclFallback = FALSE
  MaxAttempt = 1
  j1 = j1
  JobIds = {j1}
INIT Init
NEXT Next
INVARIANTS
  InvPendingNeverFailed
