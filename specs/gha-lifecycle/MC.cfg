\* Base bug-hunt config: faithful model of the FIXED code (all Bug* FALSE),
\* green expected. Findings 1-4 were fixed 2026-07-06; their invariants now
\* live here and must PASS (mutation configs MCMutation1-6 prove teeth).
\* Bounds: 2 attempts x 1 job - exercises the full retry pipeline
\* (re-run, previous-attempt fetch ok/fail, links, per-attempt metrics).
\* Pair-of-jobs interactions within one attempt are covered by MC2.cfg;
\* 2 attempts x 2 jobs blows past 10^7 distinct states (documented in
\* README) and adds no per-job logic the two smaller configs miss.
CONSTANTS
  Bug = FALSE
  BugPendingRunFailed = FALSE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = FALSE
  BugNoConclFallback = FALSE
  MaxAttempt = 2
  j1 = j1
  JobIds = {j1}
INIT Init
NEXT Next
INVARIANTS
  TypeInvariant
  InvPendingNeverFailed
  InvEmittedHaveConcl
  InvPendingRunNotFailed
  InvLinkTargetsEmitted
  InvQueueOnlyCompletedJobs
  InvTimedOutAttemptNotSuccess
  InvPendingJobsVisible
  InvCompletedRunSpanHasConclusion
