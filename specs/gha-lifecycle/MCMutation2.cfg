\* MUTATION for fixed Finding 2 (was MCFinding2): BugPendingRunFailed = TRUE
\* restores the old two-way run classification (anything not
\* completed+success -> FailedRuns). InvPendingRunNotFailed MUST FAIL:
\* a run still queued at fetch time is counted failed.
CONSTANTS
  Bug = FALSE
  BugPendingRunFailed = TRUE
  BugDanglingLink = FALSE
  BugQueueUngated = FALSE
  BugTimedOutSuccess = FALSE
  BugUnstartedInvisible = FALSE
  BugNoConclFallback = FALSE
  MaxAttempt = 1
  j1 = j1
  JobIds = {j1}
INIT Init
NEXT Next
INVARIANTS
  InvPendingRunNotFailed
