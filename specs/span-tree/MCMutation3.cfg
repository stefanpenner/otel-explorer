\* Mutation for fixed Finding 3 (FINDINGS.md #10): Bug2=TRUE restores the
\* pre-2026-07-06 arrival-order dedup, where WHICH spans survive depends on
\* the arrival order of same-ID spans ([api, api', runner] keeps {runner,
\* api'} but [api, runner, api'] keeps only {runner}).
\* MUST FAIL on DedupOrderInsensitive (proves the invariant keeps its teeth).
\* (Was MCFinding3.cfg while the bug was live in the code.)
SPECIFICATION Spec
CONSTANTS
  Bug          = FALSE
  Bug2         = TRUE
  Bug3         = FALSE
  IncludeCycle = FALSE
  FixOrder     = FALSE
INVARIANTS
  TypeOK
  DedupOrderInsensitive
