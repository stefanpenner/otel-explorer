\* Mutation for fixed Finding 2 (FINDINGS.md #11): Bug3=TRUE removes the
\* parent-cycle containment pass. The mutual-parent pair (id5 <-> id6) links
\* into a 2-cycle, neither is a root, and FlattenTree silently drops both.
\* MUST FAIL on NoSilentLossForest (proves the invariant keeps its teeth).
\* (Was MCFinding2.cfg while the bug was live in the code.)
SPECIFICATION Spec
CONSTANTS
  Bug          = FALSE
  Bug2         = FALSE
  Bug3         = TRUE
  IncludeCycle = TRUE
  FixOrder     = TRUE
INVARIANTS
  TypeOK
  NoSilentLossForest
