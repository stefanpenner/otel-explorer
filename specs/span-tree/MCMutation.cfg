\* Mutation: Bug=TRUE disables the runner-wins pair collapse (dedup
\* degenerates to identity). The {1 api, 1 runner} pair (spans 4/7, id3)
\* no longer collapses. MUST FAIL on DedupCollapsesRunnerPair.
SPECIFICATION Spec
CONSTANTS
  Bug          = TRUE
  Bug2         = FALSE
  Bug3         = FALSE
  IncludeCycle = FALSE
  FixOrder     = TRUE
INVARIANTS
  TypeOK
  DedupCollapsesRunnerPair
