githubConfigUrl: https://github.com/stefanpenner/-ci-test
githubConfigSecret: arc-github-secret
minRunners: 0
maxRunners: 3
scaleSetLabels:
  - kind
template:
  spec:
    containers:
      - name: runner
        image: otel-runner:dev
        imagePullPolicy: Never
        env:
          - name: ACTIONS_RUNNER_OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc:4318"
          - name: ACTIONS_RUNNER_OTLP_PROPAGATE
            value: "true"
          - name: K8S_POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
          - name: K8S_NAMESPACE_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - name: K8S_NODE_NAME
            valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.name=github-actions-runner,deployment.environment=demo,cicd.system=github-actions,k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)"
